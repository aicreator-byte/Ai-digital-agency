name: Agency Harian

on:
  schedule:
    # 00:00 UTC = 07:00 WIB — prospek pagi
    - cron: "0 0 * * *"
    # 10:00 UTC = 17:00 WIB — draf follow-up sore
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      business_name:
        description: "Nama bisnis untuk website"
        required: true
        type: string
      package:
        description: "Paket website"
        required: true
        default: "W1"
        type: choice
        options:
          - W1
          - W2
          - W3

# Token Actions hanya boleh baca repo + tulis Issue (antrean kerja).
# Data bisnis TIDAK di-commit ke repo (tetap artifact saja).
permissions:
  contents: read
  issues: write

jobs:
  prospek-pagi:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SCRAPER_BACKEND: osm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-actions.txt
      - run: mkdir -p storage out
      - run: python3 scripts/daily_prospects.py
      - uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
      # Antrean kerja: Issue berisi JUMLAH + link artifact saja
      # (isi data bisnis tetap di artifact, tidak masuk Issue/repo).
      - name: Buat Issue ringkasan prospek
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          F=$(ls out/leads-*.json | head -1)
          N=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" "$F")
          gh issue list --label agency --state open --search "Prospek pagi" --json number -q '.[].number' | xargs -r gh issue close || true
          gh issue create --label agency \
            --title "Prospek pagi — $(date +%F): $N lead baru" \
            --body "Lead baru hari ini: $N. Detail lengkap (nama, kategori, lokasi) ada di artifact run ini: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  followup-sore:
    if: github.event_name == 'schedule' && github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    env:
      SCRAPER_BACKEND: osm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-actions.txt
      - run: mkdir -p storage out
      - run: python3 scripts/followup_drafts.py
      - uses: actions/upload-artifact@v4
        with:
          name: followup-drafts-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
      # Antrean kerja: Issue berisi draf siap kirim (nama + pesan saja,
      # tanpa nomor telepon). Tutup Issue lama yang sejenis supaya antrean
      # tidak menumpuk. Pengiriman tetap MANUAL (bukan dari workflow).
      - name: Buat Issue antrean follow-up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          F=$(ls out/followup-drafts-*.md | head -1)
          gh issue list --label agency --state open --search "Follow-up untuk dikirim" --json number -q '.[].number' | xargs -r gh issue close || true
          gh issue create --label agency \
            --title "Follow-up untuk dikirim — $(date +%F)" \
            --body-file "$F"

  bangun-website:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-actions.txt
      - run: >-
          python3 scripts/build_website.py
          --business "${{ inputs.business_name }}"
          --package "${{ inputs.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: website-${{ inputs.business_name }}-${{ inputs.package }}
          path: out/
          if-no-files-found: error
      # Deploy BENERAN ke Cloudflare Pages (bukan echo lagi).
      # Butuh 2 secret repo: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
      # Tanpa keduanya, job tetap menghasilkan artifact ZIP (tidak gagal).
      - name: Deploy ke Cloudflare Pages
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler pages deploy "$(cat out/deploy-dir.txt)" \
            --project-name "$(cat out/project-name.txt)" --commit-dirty=true
          echo "Live: https://$(cat out/project-name.txt).pages.dev"
